# cli/cli's "Unit and Integration Tests" build job at the pin, Linux only.
name: Bench cli
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: Runner label, ubuntu-24.04 or the scale set's name
        required: true
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-key-prefix: go-race
      - run: go mod download
      - run: go test -count=1 -race -tags=integration ./...
      - run: go build -v ./cmd/gh
      - run: go build -v -tags=ghdebug ./cmd/gh
